<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Панель управления</title>
    <!-- Подключение официального скрипта Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b101a; /* Глубокий темный фон */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 80px; /* Место под нижнее меню */
        }
        .container { padding: 20px; }
        h1 { font-size: 22px; margin-bottom: 20px; font-weight: 600; }
        
        /* Пластиковые полупрозрачные карточки */
        .card {
            background: #151e2b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Нижнее плавающее меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111823;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 20px 0;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b; /* Серый цвет для неактивных */
            font-size: 12px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #3b82f6; /* Ярко-синий для активной вкладки */
        }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Сводка</h1>
        <div class="card">
            <div style="color: #64748b; font-size: 14px;">Баланс</div>
            <div style="font-size: 28px; font-weight: bold; margin-top: 5px;">1 649.6 ₽</div>
        </div>
        <div class="card">
            <p>Здесь будут графики, настройки автовыдачи и умные автоответы на отзывы.</p>
        </div>
    </div>

    <!-- Навигация -->
    <div class="bottom-nav">
        <div class="nav-item">
            <span class="nav-icon">📁</span>
            Каталог
        </div>
        <div class="nav-item">
            <span class="nav-icon">🧾</span>
            Заказы
        </div>
        <div class="nav-item active">
            <span class="nav-icon">👤</span>
            Профиль
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открывает приложение сразу на весь экран
        tg.ready();  // Сообщает Telegram, что приложение готово
    </script>
</body>
</html>
